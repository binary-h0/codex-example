name: Docs Pipeline

permissions:
  contents: write
  pull-requests: write

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      event:
        description: 'Trigger docs generation'
        required: false
        default: docs-generation
  repository_dispatch:
    types: [regen-docs]

jobs:
  docs:
    runs-on: self-hosted # ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate docs
        run: |
          npm install -g @openai/codex
          export OPENAI_API_KEY="${{ secrets.AZURE_OPENAI_API_KEY }}"
          export AZURE_OPENAI_API_KEY="${{ secrets.AZURE_OPENAI_API_KEY }}"
          codex -a auto-edit --quiet "Draft or update documentation for changed code write to DOCS.md"
      - name: Create PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: docs/update
          base: main
          title: "Update documentation"
          body: "Docs generated automatically by Codex CLI"
